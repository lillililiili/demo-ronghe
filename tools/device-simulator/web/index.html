<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信号模拟器 · 东营低空平台</title><link rel="stylesheet" href="/map-runtime/map.css"><link rel="stylesheet" href="style.css?v=20260924-response-1"><link rel="stylesheet" href="external.css?v=20261003-plan-input-1"><link rel="stylesheet" href="workspace.css?v=20260927-airspace-draw-1"><link rel="stylesheet" href="light.css?v=20261003-plan-input-1"><link rel="stylesheet" href="realtime.css?v=20261008-punishment-1"><link rel="stylesheet" href="flow-picker.css?v=20261025-verification-handoff-1"><link rel="stylesheet" href="scene-map-guide.css?v=20261021-1"><link rel="stylesheet" href="simple.css?v=20261028-adsb-1"></head>
<body class="simulator-workspace simple-layout" data-scene-store="dongying-mqtt-simulator-simple-v1">
<header class="header"><div class="brand"><img src="assets/fusion.svg" alt="" onerror="this.hidden=true"><div><h1>信号模拟器</h1><span class="subtitle">东营低空平台</span></div></div><nav class="sim-topnav" aria-label="模拟器页面"><a aria-current="page" href="/">模拟</a><a href="/external.html">通知收件箱</a><a href="/tcp-radar.html">TCP 雷达</a><button type="button" data-action="runtime-log">运行记录</button><a href="/classic.html" class="muted-link">原版页面</a></nav><div class="header-right"><span class="badge amber">模拟环境</span><span class="connection"><i></i>尚未登录系统</span><button data-action="connection">登录系统</button></div></header>
<div class="scenario-bar"><label class="scene-name"><span class="sr-only">场景名称</span><input id="scene-name" aria-label="场景名称" value="东营低空风险联调"></label><details class="scene-tools" id="scene-tools"><summary>场景 ▾</summary><div class="scene-tools-menu" id="scene-tools-menu"></div></details><button class="cyan-button" data-action="preview" id="preview-button">地图预演</button><span id="save-status" class="muted">未保存的本地草稿</span><span class="edit-status" id="run-status" hidden>编辑中</span>
<div class="run-controls"><details class="run-mode" id="run-mode"><summary><span class="muted">运行方式</span><b id="run-mode-label">正常</b> ▾</summary><div class="run-mode-menu" id="run-mode-menu"><button type="button" data-simple="realtime-settings">修改运行方式…</button><p class="field-note" id="run-mode-note"></p><div id="run-mode-realtime"></div></div></details><label class="duration"><span class="muted">时长</span><select id="duration" aria-label="运行时长"><option value="0">持续运行（手动停止）</option><option value="0.5">30 秒</option><option value="1">1 分钟</option><option value="5">5 分钟</option><option value="10" selected>10 分钟</option><option value="15">15 分钟</option><option value="20">20 分钟</option></select></label><span id="video-settings-slot"></span><button class="primary start-button" data-action="integration">▶ 开始</button><button data-action="stop" id="stop-button" disabled>停止</button></div></div>
<div id="flow-banner" class="flow-banner" role="region" aria-label="当前流程" hidden></div>
<main>
<section class="workspace">
<aside class="panel objects"><div class="panel-heading"><h2>添加</h2><span class="muted">点一下，再点地图</span></div><div class="add-palette">
<div class="group-title">目标</div><div class="tile-grid"><button type="button" class="tile" data-action="place-target" data-kind="uav"><img src="assets/uav.svg" alt="">无人机</button><button type="button" class="tile" data-action="place-target" data-kind="bird"><img src="assets/bird.svg" alt="">鸟群</button><button type="button" class="tile" data-action="place-target" data-kind="balloon"><img src="assets/balloon.svg" alt="">气球</button><button type="button" class="tile" data-action="place-target" data-kind="unknown"><img src="assets/fusion.svg" alt="">未知目标</button><button type="button" class="tile" data-action="place-target" data-kind="identifying"><img src="assets/fusion.svg" alt="">识别中目标</button><button type="button" class="tile" data-action="place-target" data-kind="flight"><img src="assets/plane.svg" alt="">民航航班</button></div>
<div class="group-title">设备</div><div class="tile-grid"><button type="button" class="tile" data-action="tool" data-tool="site"><img src="assets/radar.svg" alt="">放置设备组</button><button type="button" class="tile" data-simple="adsb-device"><img src="assets/adsb.svg" alt="">航班接收机</button></div>
<div class="group-title">区域</div><div class="tile-grid"><button type="button" class="tile" data-action="tool" data-tool="zone"><img src="assets/area.svg" alt="">空域</button></div>
<div class="group-title">任务和资料</div><div class="tile-grid"><button type="button" class="tile" data-action="tool" data-tool="plan"><img src="assets/route.svg" alt="">飞行任务</button><button type="button" class="tile" data-simple="weather"><img src="assets/weather.svg" alt="">气象预报</button></div>
</div><div class="scene-list"><div class="group-title">场景里有<small id="totals"></small></div><div id="object-tree" class="panel-scroll"></div></div></aside>
<section class="panel map-panel" aria-label="地图场景编辑器"><div class="map-stage" id="map-stage"><div id="system-map" aria-label="与业务系统共用的真实地图"></div><svg id="map" viewBox="0 0 1000 650" aria-label="设备、目标、航线和空域边界" role="img"><g id="map-layers"></g><g id="draw-layer"></g></svg><div id="map-status" role="status"><span>正在加载系统地图</span><button id="retry-map" type="button">重新加载地图</button></div><div id="map-hint" class="map-hint">选择地图对象，编辑位置与关联</div><div id="draw-controls" class="draw-controls" hidden><span id="draw-message"></span><button data-action="undo-point">撤销点</button><button class="primary" data-action="finish-draw">确认绘制</button><button data-action="cancel-draw">取消</button></div><div id="group-placement" class="group-placement" hidden><span id="group-placement-text"></span><button id="edit-pending-group" data-action="edit-pending-group">调整设备组</button><button data-action="cancel-draw">取消放置</button></div><div class="map-legend"><span><b class="line dashed"></b>任务航线</span><span><b class="line"></b>模拟轨迹</span><span><b class="zone-key"></b>空域边界</span></div><div class="map-zoom"><button data-action="zoom-in" aria-label="放大地图">放大</button><button data-action="zoom-out" aria-label="缩小地图">缩小</button><button data-action="zoom-reset">全览</button></div></div></section>
<aside class="panel inspector"><div class="panel-heading"><h2 id="inspector-title">对象设置</h2></div><div id="inspector" class="panel-scroll"></div></aside>
<aside class="panel input-dock" id="input-dock" aria-label="资料输入" hidden><div class="dock-head"><span id="dock-title">资料输入</span><button type="button" data-workspace-tab="objects">返回</button></div><iframe id="input-frame" title="资料输入表单"></iframe></aside>
</section>
<section class="panel risks"><div class="risk-heading"><div><h2>平台风险判定 <span id="risk-count"></span></h2><span id="risk-enabled-count" class="muted"></span><span class="muted">系统根据目标观测与任务/空域规则判定，不代表已产生报警</span></div><div class="risk-actions"><div id="risk-filters" class="filter-group"></div><button id="toggle-risks" aria-controls="risk-list" aria-expanded="true">收起列表</button></div></div><div id="risk-list" class="risk-list"></div></section>
<div id="preview-bar" class="preview-bar" hidden><span>本地轨迹预演</span><input type="range" min="0" max="100" value="0" id="preview-range" aria-label="预演进度"><span id="preview-percent">0%</span><span class="muted">仅画面预览</span></div>
</main>
<footer><div class="status-row"><b>运行情况</b><span id="status-mode">未开始</span><span id="status-sent">设备上报 已发 0 条</span><span id="status-last">最近上报 尚无</span><span id="status-counter">反制设备 未连接</span><span id="status-notify">短信电话 收到 0 / 已回执 0</span><span id="status-adsb">航班接收机 未放置</span><span class="status-video">光电视频 <span id="video-summary-slot"></span></span><div class="status-actions"><button type="button" id="risk-button" aria-controls="risk-list">平台风险判定</button><span id="status-pause-slot"></span><span id="status-video-toggle-slot"></span><details class="status-more" id="status-more"><summary>更多 ▾</summary><div class="status-more-menu" id="status-more-menu"></div></details></div></div><div class="status-errors" id="status-errors"></div></footer>
<div id="dialog-shell" class="dialog-shell" hidden><div class="scrim" data-action="close-dialog"></div><section id="dialog" class="drawer" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="drawer-heading"><h2 id="dialog-title"></h2><button data-action="close-dialog">关闭</button></div><div id="dialog-body" class="drawer-body"></div></section></div>
<div id="toast" role="status" aria-live="polite" hidden></div><script src="notification-ui.js?v=20260924-response-1"></script><script src="risk-config.js?v=20261005-auto-association-1"></script><script src="plan-time.js?v=20261013-picker-1"></script><script src="zone-rings.js?v=20261021-flow9-1"></script><script src="scene-map-guide.js?v=20261021-1"></script><script src="app.js?v=20261028-adsb-1"></script><script src="runtime.js?v=20261027-simple-1"></script><script src="video-control.js?v=20261007-1"></script><script src="workspace.js?v=20261027-simple-1"></script><script src="realtime.js?v=20261027-simple-1"></script><script src="start-check.js?v=20261013-picker-1"></script><script src="flow-picker.js?v=20261025-verification-handoff-1"></script><script type="module" src="/map-runtime/map.js"></script>
<script src="fullchain.js?v=20261027-simple-1"></script>
<script src="simple.js?v=20261029-dense-1"></script></body></html>
