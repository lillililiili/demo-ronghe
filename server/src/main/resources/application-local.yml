spring:
  flyway:
    # 协作者 A 的 V202609050001 编号低于本地库已应用版本；仅本地开发库允许乱序应用，生产配置不放开。
    out-of-order: true
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/uav
    username: uav
    password: uav
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: false

app:
  source-mode: live
  evidence-dir: ./data/evidence
  handoff:
    channel: ${APP_HANDOFF_CHANNEL:mock}
  device:
    mock-adapter:
      enabled: ${APP_DEVICE_MOCK_ADAPTER_ENABLED:true}
  dev-seed:
    enabled: ${APP_DEV_SEED_ENABLED:true}
    password: ${APP_DEV_SEED_PASSWORD:changeme}
  disposal:
    expiry:
      enabled: true
      poll-millis: 60000
