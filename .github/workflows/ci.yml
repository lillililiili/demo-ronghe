name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dongying-vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dongying-vue/package-lock.json
      - run: npm ci
      - run: node tools/scan.cjs
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # PostgreSQL/PostGIS 服务：让靠 POSTGRES_TEST_URL 门禁的专项用例（空间判定、只增触发器、并发、分两步升级）
    # 在 CI 上真的跑起来，而不是静默跳过（决策 15-9）。
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: uav
          POSTGRES_PASSWORD: uav
          POSTGRES_DB: ci_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uav -d ci_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 阶段 4–15 的 PG 专项都硬校验库名 ^stage456_verify_，ci_verify 会被拒绝加载上下文（首跑 34295804430 全 ERROR）。
      POSTGRES_TEST_URL: jdbc:postgresql://127.0.0.1:5432/stage456_verify_ci
      POSTGRES_TEST_USER: uav
      POSTGRES_TEST_PASSWORD: uav
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw
      - name: Create isolation databases for the PostgreSQL suites
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          PGPASSWORD=uav psql -h 127.0.0.1 -U uav -d ci_verify -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          PGPASSWORD=uav psql -h 127.0.0.1 -U uav -d ci_verify -c "CREATE DATABASE stage456_verify_ci;"
          PGPASSWORD=uav psql -h 127.0.0.1 -U uav -d stage456_verify_ci -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          PGPASSWORD=uav psql -h 127.0.0.1 -U uav -d ci_verify -c "CREATE DATABASE stage2_target_verify_ci;"
          PGPASSWORD=uav psql -h 127.0.0.1 -U uav -d stage2_target_verify_ci -c "CREATE EXTENSION IF NOT EXISTS postgis;"
      # TargetReadPostgresApiTest 的守卫要求库名匹配 stage2_target_verify_*，在 ci_verify 上会拒绝加载上下文，
      # 主跑必须排掉它，下一步用专属库单独跑（审查阶段 15 第 1 轮 P0-1）。
      - name: Full test suite (H2 + PostgreSQL suites on stage456_verify_ci)
        run: ./mvnw -B test -Dtest='!TargetReadPostgresApiTest' -Dsurefire.failIfNoSpecifiedTests=false
      - name: TargetRead PostgreSQL suite (needs its own stage2_target_verify_* database)
        run: ./mvnw -B -Dtest=TargetReadPostgresApiTest -Dsurefire.failIfNoSpecifiedTests=false test
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://127.0.0.1:5432/stage2_target_verify_ci
      - name: Package (tests already ran above)
        run: ./mvnw -B -DskipTests package
      - name: Upload server jar for the E2E job
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: server/target/low-altitude-server-*.jar
          retention-days: 3
      - name: Test summary (run / failures / errors / skipped)
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('target/surefire-reports/TEST-*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
          print(f"## Backend tests\n\n| run | failures | errors | skipped |\n| --- | --- | --- | --- |\n| {t} | {f} | {e} | {s} |\n")
          print("跳过数应只剩非 PostgreSQL 门禁的用例；若接近 90+，说明 PostgreSQL 服务没接上。")
          EOF

  e2e:
    # 阶段 15 起的 E2E 骨架（Playwright）：稳定前不阻断合并（决策 15-9）。
    # 作业级 if 在 checkout 前求值、hashFiles 恒空（审查第 1 轮 P1-1），因此改为 checkout 之后按文件存在与否逐步判断。
    # 首跑（34295804430）没有后端，Vite 代理全部 ECONNREFUSED 8081：现在下载 backend 作业打好的 jar，
    # 用 local 配置（开发种子开、口令 changeme）跑在一个全新的 PostGIS 库上，再跑用例——和本机验收同一套启动参数。
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [frontend, backend]
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: uav
          POSTGRES_PASSWORD: uav
          POSTGRES_DB: e2e_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uav -d e2e_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: dongying-vue
    steps:
      - uses: actions/checkout@v4
      - name: Detect Playwright config
        id: pw
        run: |
          if [ -f playwright.config.js ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::dongying-vue/playwright.config.js 不存在，E2E 作业无用例可跑"; fi
      - uses: actions/setup-java@v4
        if: steps.pw.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        if: steps.pw.outputs.present == 'true'
        with:
          name: server-jar
          path: ${{ runner.temp }}/server
      - name: Start backend on 8081 (local profile, fresh PostGIS database)
        if: steps.pw.outputs.present == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          PGPASSWORD=uav psql -h 127.0.0.1 -U uav -d e2e_verify -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          JAR=$(ls "${{ runner.temp }}"/server/low-altitude-server-*.jar | head -1)
          nohup java -jar "$JAR" --spring.profiles.active=local --server.port=8081 \
            --spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/e2e_verify \
            --app.fusion.enabled=true --app.rule-engine.enabled=true \
            --app.rule-engine.allow-demo-active=true --app.rule-engine.replay.run-on-start=true \
            > "${{ runner.temp }}/backend.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8081/actuator/health >/dev/null; then echo "backend healthy after ${i}x2s"; exit 0; fi
            sleep 2
          done
          echo "::error::backend did not become healthy in 180s"; tail -n 200 "${{ runner.temp }}/backend.log"; exit 1
      - uses: actions/setup-node@v4
        if: steps.pw.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dongying-vue/package-lock.json
      - run: npm ci
        if: steps.pw.outputs.present == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.pw.outputs.present == 'true'
      - run: npm run e2e -- --reporter=list
        if: steps.pw.outputs.present == 'true'
        env:
          E2E_PASSWORD: changeme
      - name: Backend log (on failure)
        if: failure() && steps.pw.outputs.present == 'true'
        run: tail -n 300 "${{ runner.temp }}/backend.log" || true
      - uses: actions/upload-artifact@v4
        if: failure() && steps.pw.outputs.present == 'true'
        with:
          name: playwright-report
          path: dongying-vue/playwright-report
          retention-days: 3
