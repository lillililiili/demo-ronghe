<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空域下发模拟</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="external.css"><link rel="stylesheet" href="light.css"><style>body{padding:16px}.external-grid{grid-template-columns:repeat(2,minmax(0,1fr))}label{display:grid;gap:6px;margin-bottom:12px}input,select,textarea{width:100%;box-sizing:border-box}textarea{min-height:140px}section{margin-bottom:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#records button{margin:4px} .external-card{padding:16px}.field-hint{font-size:12px;line-height:1.6;color:#52637a}details{margin-top:12px}summary{cursor:pointer}@media(max-width:480px){.external-grid{grid-template-columns:1fr}}</style></head><body class="external-page"><section class="panel external-card"><h2>空域下发 <span class="badge amber">模拟环境</span></h2><p>选择空域类型，在地图绘制边界后确认下发。绘制仅保存草稿，不会自动设为限飞区。</p><p id="status" role="status"></p><button id="refresh" type="button">刷新系统资料</button><button id="login" type="button">登录系统</button></section><form id="form" class="panel external-card"><div class="external-grid"><label>操作<select name="action"><option value="UPSERT">新增或更新</option><option value="WITHDRAW">撤销</option></select></label><label>模拟消息编号<input name="message_id" required maxlength="64" pattern="[A-Za-z0-9_-]{1,64}"></label><label>空域编号<input name="airspace_no" required></label><label>下发修订次序<input name="revision" type="number" min="1" step="1" required></label></div><div id="upsert"><div class="external-grid"><label>空域名称<input name="name" required></label><label>归属单位与区县<select name="scope" required disabled aria-describedby="scope-hint"><option value="">请先登录系统，再读取归属资料</option></select><small id="scope-hint" class="field-hint">请先登录系统，再读取归属资料</small></label><label>空域种类<select name="kind_code" required><option value="">请选择空域类型</option><option value="PROHIBITED">禁飞区</option><option value="RESTRICTED">限制区</option><option value="ALTITUDE_LIMIT">限高区</option><option value="PERMITTED">允许区</option><option value="TEMPORARY_CONTROL">临时管制区</option></select></label><label>高度基准<select name="altitude_datum"><option value="">请选择高度基准</option><option value="AMSL">海拔高度</option><option value="AGL">相对地面高度</option></select></label><label>最低高度（米，可空）<input name="min_altitude_m" type="number" step="any"></label><label>最高高度（米，可空）<input name="max_altitude_m" type="number" step="any"></label><label>生效时间（北京时间）<input name="valid_from" type="datetime-local" step="1" required></label><label>结束时间（北京时间，可空）<input name="valid_to" type="datetime-local" step="1"></label></div><label>使用地图已绘制空域<select id="zones"><option value="">正在读取地图空域</option></select></label><p id="zones-hint" class="field-hint">复用地图边界，无需重复绘制。</p><button id="zones-draw" type="button">绘制空域边界</button><button id="zones-refresh" type="button">刷新地图空域</button><p id="boundary-summary" class="field-hint">可选择地图空域，或继续使用已保存的边界草稿。</p><details><summary>高级：查看边界或导入 GeoJSON</summary><label>WGS84 空域边界 GeoJSON<textarea name="boundary" spellcheck="false"></textarea></label><label>导入边界文件<input id="file" type="file" accept=".json,.geojson,application/json,application/geo+json"></label></details></div><div id="withdraw" hidden><label>撤销生效时间（北京时间）<input name="effective_at" type="datetime-local" step="1"></label></div><label>下发或撤销原因<textarea name="change_reason" required></textarea></label><div class="external-actions"><button id="new" type="button">新建下发草稿</button><button id="submit" type="submit" class="primary">提交模拟下发</button></div><p>重试保留消息编号与内容；修改内容后请使用新的消息编号。同一空域修订次序须递增。</p></form><section class="panel external-card"><h3>本次接收回执</h3><pre id="receipt">尚未提交</pre><p id="message" role="status" aria-live="polite"></p></section><section class="panel external-card"><h3>已下发模拟空域</h3><div id="records">请登录后刷新</div></section><script src="airspace-form.js?v=20260927-airspace-draw-1"></script><script src="airspace.js?v=20260927-airspace-draw-1"></script></body></html>
