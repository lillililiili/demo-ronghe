<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信号模拟器 · 东营低空平台</title><link rel="stylesheet" href="/map-runtime/map.css"><link rel="stylesheet" href="style.css?v=20260924-response-1"><link rel="stylesheet" href="external.css?v=20260924-response-1"><link rel="stylesheet" href="workspace.css?v=20260924-response-1"></head>
<body class="simulator-workspace">
<header class="header"><div class="brand"><img src="assets/fusion.svg" alt="" onerror="this.hidden=true"><div><h1>信号模拟器</h1><span class="subtitle">东营低空平台 · 本机场景联调</span></div></div><nav class="sim-topnav" aria-label="模拟器页面"><a aria-current="page" href="/">信号地图</a><a href="/external.html">通知收件箱</a></nav><div class="header-right"><span class="badge amber">模拟环境</span><span class="connection"><i></i>尚未登录系统</span><button data-action="connection">登录系统</button></div></header>
<div class="scenario-bar"><label class="scene-name">场景名称<input id="scene-name" aria-label="场景名称" value="东营低空风险联调"></label><label class="duration">运行时长<select id="duration" aria-label="运行时长"><option value="0.5">30 秒</option><option value="1">1 分钟</option><option value="5">5 分钟</option><option value="10" selected>10 分钟</option><option value="15">15 分钟</option><option value="20">20 分钟</option></select></label><span id="save-status" class="muted">未保存的本地草稿</span><span class="edit-status" id="run-status">编辑中</span></div>
<main>
<section class="workspace">
<aside class="panel objects"><div class="panel-heading"><h2>场景对象</h2><span class="muted">本地草稿</span></div><div id="object-tree" class="panel-scroll"></div><div class="sidebar-foot"><span class="tiny-dot"></span> 点击对象，在地图上定位</div></aside>
<section class="panel map-panel" aria-label="地图场景编辑器"><div class="workspace-tabs" role="tablist" aria-label="地图工作区">
<button id="tab-objects" role="tab" aria-selected="true" aria-controls="tools-objects" data-workspace-tab="objects">设备与目标</button>
<button id="tab-routes" role="tab" aria-selected="false" aria-controls="tools-routes" data-workspace-tab="routes" tabindex="-1">航线与区域</button>
<button id="tab-inputs" role="tab" aria-selected="false" aria-controls="tools-inputs" data-workspace-tab="inputs" tabindex="-1">计划与气象输入</button></div>
<div class="map-toolbar">
<div id="tools-objects" role="tabpanel" aria-labelledby="tab-objects" data-tool-panel="objects"><button data-action="tool" data-tool="site"><img src="assets/radar.svg" alt="">放置设备组</button><button data-action="add-target"><img src="assets/uav.svg" alt="">添加目标</button></div>
<div id="tools-routes" role="tabpanel" aria-labelledby="tab-routes" data-tool-panel="routes" hidden><button data-action="tool" data-tool="plan"><img src="assets/route.svg" alt="">绘制计划航线</button><button data-action="tool" data-tool="zone"><img src="assets/area.svg" alt="">绘制限飞区域</button></div>
<div id="tools-inputs" role="tabpanel" aria-labelledby="tab-inputs" data-tool-panel="inputs" hidden><button data-input-tab="plans" aria-pressed="true"><img src="assets/document.svg" alt="">飞行计划输入</button><button data-input-tab="weather" aria-pressed="false"><img src="assets/weather.svg" alt="">气象预报输入</button></div></div><div class="map-stage" id="map-stage"><div id="system-map" aria-label="与业务系统共用的真实地图"></div><svg id="map" viewBox="0 0 1000 650" aria-label="设备、目标、航线和限飞区" role="img"><g id="map-layers"></g><g id="draw-layer"></g></svg><div id="map-status" role="status"><span>正在加载系统地图</span><button id="retry-map" type="button">重新加载地图</button></div><div id="map-hint" class="map-hint">选择地图对象，编辑位置与关联</div><div id="draw-controls" class="draw-controls" hidden><span id="draw-message"></span><button data-action="undo-point">撤销点</button><button class="primary" data-action="finish-draw">完成绘制</button><button data-action="cancel-draw">取消</button></div><div id="group-placement" class="group-placement" hidden><span id="group-placement-text"></span><button id="edit-pending-group" data-action="edit-pending-group">调整设备组</button><button data-action="cancel-draw">取消放置</button></div><div class="map-legend"><span><b class="line dashed"></b>计划航线</span><span><b class="line"></b>模拟轨迹</span><span><b class="zone-key"></b>限飞区域</span></div><div class="map-zoom"><button data-action="zoom-in" aria-label="放大地图">放大</button><button data-action="zoom-out" aria-label="缩小地图">缩小</button><button data-action="zoom-reset">全览</button></div></div></section>
<aside class="panel inspector"><div class="panel-heading"><h2 id="inspector-title">风险设置</h2><span class="muted">参数编辑</span></div><div id="inspector" class="panel-scroll"></div></aside>
<aside class="panel input-dock" id="input-dock" aria-label="计划与气象输入" hidden><iframe id="input-frame" title="计划与气象输入表单"></iframe></aside>
</section>
<section class="panel risks"><div class="risk-heading"><div><h2>风险场景 <span id="risk-count"></span></h2><span id="risk-enabled-count" class="muted"></span><span class="muted">预设条件 · 不代表已产生报警</span></div><div class="risk-actions"><div id="risk-filters" class="filter-group"></div><button data-action="add-risk">添加风险</button><button id="toggle-risks" aria-controls="risk-list" aria-expanded="true">收起列表</button></div></div><div id="risk-list" class="risk-list"></div></section>
<div id="preview-bar" class="preview-bar" hidden><span>本地轨迹预演</span><input type="range" min="0" max="100" value="0" id="preview-range" aria-label="预演进度"><span id="preview-percent">0%</span><span class="muted">仅画面预览</span></div>
</main>
<footer><span id="totals"></span><span class="prototype-label">模拟数据经 MQTT 接入现有系统</span><div><button data-action="save">保存场景</button><button class="cyan-button" data-action="preview" id="preview-button">地图预演</button><button class="primary" data-action="integration">启动 MQTT 模拟</button><button data-action="stop" id="stop-button" disabled>停止</button></div></footer>
<div id="dialog-shell" class="dialog-shell" hidden><div class="scrim" data-action="close-dialog"></div><section id="dialog" class="drawer" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="drawer-heading"><h2 id="dialog-title"></h2><button data-action="close-dialog">关闭</button></div><div id="dialog-body" class="drawer-body"></div></section></div>
<div id="toast" role="status" aria-live="polite" hidden></div><script src="notification-ui.js?v=20260924-response-1"></script><script src="app.js?v=20260924-response-1"></script><script src="runtime.js?v=20260924-login-1"></script><script src="workspace.js?v=20260924-response-1"></script><script type="module" src="/map-runtime/map.js"></script>
</body></html>
