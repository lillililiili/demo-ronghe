<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>无人机融合感知与低空安全管理平台 · 监控大屏</title>
<link rel="icon" type="image/png" href="/assets/img/brand/logo-mark.png">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/bigscreen.css">
</head>
<!-- data-theme="overview" 接入业务系统的主题层：page-art 贴图 + 强调色 + 面板/KPI 工艺全部继承 -->
<body class="bs-body" data-theme="overview">
<div class="bs-root">
  <header class="bs-hdr">
    <div class="bs-hdr-l"><img src="/assets/img/brand/logo-mark.png" alt="" width="30" height="30">无人机融合感知与低空安全管理平台</div>
    <div class="bs-hdr-t"><i class="bs-wing" aria-hidden="true"></i><span>低空安全监控大屏</span><i class="bs-wing r" aria-hidden="true"></i></div>
    <div class="bs-hdr-r"><span id="bsClk"></span><a class="btn ghost bs-exit" href="/index.html" title="返回业务系统">退出大屏</a></div>
  </header>
  <div class="bs-grid">
    <aside class="bs-col">
      <section class="panel">
        <div class="ph"><h3>感知目标趋势</h3><span class="sub">近 7 日</span></div>
        <div class="pb"><div id="bsTrend" class="bs-chart"></div></div>
      </section>
      <section class="panel" data-module="target-dynamics">
        <div class="ph"><h3>重点目标动态</h3><span class="sub" id="bsTgtSub"></span></div>
        <div class="pb bs-tbwrap"><table class="tb bs-target-tb" id="bsTgtTb"></table></div>
      </section>
      <section class="panel">
        <div class="ph"><h3>告警趋势</h3><span class="sub">近 7 日告警次数</span></div>
        <div class="pb"><div id="bsAlmTrend" class="bs-chart"></div></div>
      </section>
    </aside>
    <main class="bs-mid">
      <div class="bs-kpis" id="bsKpis"></div>
      <div class="bs-map" id="bsMap"></div>
    </main>
    <aside class="bs-col">
      <section class="panel">
        <div class="ph"><h3>设备接入状态</h3><span class="sub" id="bsDevSub"></span></div>
        <div class="pb bs-tbwrap"><table class="tb" id="bsDevTb"></table></div>
      </section>
      <section class="panel">
        <div class="ph"><h3>目标类型分布</h3></div>
        <div class="pb"><div id="bsType" class="bs-chart"></div></div>
      </section>
      <section class="panel">
        <div class="ph"><h3>实时告警</h3><span class="sub" id="bsAlmSub"></span></div>
        <div class="pb bs-tbwrap"><table class="tb" id="bsAlmTb"></table></div>
      </section>
    </aside>
  </div>
</div>
<script src="/assets/js/vendor/echarts.min.js"></script>
<script src="/assets/js/mock.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/charts.js"></script>
<script src="/assets/js/geo.js"></script>
<script>
window.__AMAP_CONFIG__ = __AMAP_RUNTIME_CONFIG__;
</script>
<script src="/assets/js/map.js"></script>
<script src="/assets/js/video.js"></script>
<script src="/assets/js/case.js"></script>
<script src="/assets/js/bigscreen.js"></script>
</body>
</html>
